[project]
name = "trellis"
version = "0.1.0"
description = "Adaptive, mastery-based mathematics learning platform modeled on Cognitive Load Theory and The Math Academy Way"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "networkx>=3.2.0",
    "sympy>=1.12",
    "typing-extensions>=4.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.27.0",
]
graph = [
    "neo4j>=5.18.0",
]
migrations = [
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
