services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: ${DB_BACKEND:-relational}
      TRELLIS_JWT_SECRET: ${TRELLIS_JWT_SECRET:-trellis-dev-secret-change-in-prod}
      TRELLIS_CORS_ORIGINS: ${TRELLIS_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://trellis:trellis@postgres:5432/trellis}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-trellis_graph_dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trellis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trellis}
      POSTGRES_DB: ${POSTGRES_DB:-trellis}
    ports:
      - "5432:5432"
    volumes:
      - trellis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trellis} -d ${POSTGRES_DB:-trellis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-trellis_graph_dev}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - trellis_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  trellis_pgdata:
  trellis_neo4j_data:
